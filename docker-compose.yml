services:
  db:
    image: postgres:15-alpine
    container_name: agentsentry_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agentsentry}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agentsentry}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - agentsentry_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agentsentry_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-agentsentry}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-do-not-use-in-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@agentsentry.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-adminpassword}
      - ANALYST_EMAIL=${ANALYST_EMAIL:-analyst@agentsentry.local}
      - ANALYST_PASSWORD=${ANALYST_PASSWORD:-analystpassword}
      - AI_PROVIDER=${AI_PROVIDER:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - XAI_MODEL=${XAI_MODEL:-grok-beta}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - agentsentry_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentsentry_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agentsentry_net

networks:
  agentsentry_net:
    driver: bridge

volumes:
  pgdata:
    name: agentsentry_pgdata
