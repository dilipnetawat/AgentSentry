services:
  - type: web
    name: agentsentry-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "alembic upgrade head && cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
